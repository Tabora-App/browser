# Stalwart 1.x, трассировка Stdout в journald (stalwart/configure.py):
#   … INFO Authentication failed (auth.failed) listenerId = "imaps", …, remoteIp = 203.0.113.5, …
#   … INFO Unauthorized IP address (security.ip-unauthorized) …, remoteIp = 203.0.113.5, …
#   … WARN Too many authentication attempts (auth.too-many-attempts) …, remoteIp = …
[Definition]
failregex = \((?:auth\.failed|auth\.too-many-attempts|security\.ip-unauthorized|security\.authentication-ban)\) .*\bremoteIp = (?:::ffff:)?<ADDR>(?:,|\s|$)
ignoreregex =
