# Сайт tabora.app: доступ только через Cloudflare Tunnel (cloudflared → 127.0.0.1:8081, без TLS:
# шифрование до Cloudflare делает туннель). Работает и до выпуска сертификатов.
server {
    listen 127.0.0.1:8081;
    server_name __DOMAIN__ www.__DOMAIN__;
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    include snippets/tabora-site-headers.conf;
    root /var/www/tabora.app;
    index index.html;
    location /downloads/ {
        alias /var/www/downloads/;
        include snippets/tabora-site-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    location /assets/ {
        expires 30d;
        include snippets/tabora-site-headers.conf;
        add_header Cache-Control "public, immutable";
    }
    # точки входа без хеша в имени: браузер и Cloudflare каждый раз перепроверяют их, иначе правка сайта
    # дойдёт не сразу (всё в /assets/js/ названо по хешу и кешируется надолго)
    location ~ ^/site\.(css|js)$ {
        include snippets/tabora-site-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }
}
