# API аккаунтов и синхронизации Tabora
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __API_HOST__;
    ssl_certificate /etc/letsencrypt/live/__MAIL_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_HOST__/privkey.pem;
    include snippets/tabora-security.conf;
    client_max_body_size 32m;
    location / { proxy_pass http://127.0.0.1:7700; include snippets/tabora-proxy.conf; }
}
