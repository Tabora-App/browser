# API аккаунтов и синхронизации: только через Cloudflare Tunnel
server {
    listen 127.0.0.1:8081;
    server_name __API_HOST__;
    include snippets/tabora-security.conf;
    client_max_body_size 32m;
    # реальный адрес клиента от Cloudflare
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    location / { proxy_pass http://127.0.0.1:7700; include snippets/tabora-proxy.conf; }
}
