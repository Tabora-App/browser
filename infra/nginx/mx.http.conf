# Почтовый хост до сертификата: только ACME-проверка.
server {
    listen 80;
    listen [::]:80;
    server_name __MAIL_HOST__ autoconfig.__DOMAIN__ autodiscover.__DOMAIN__ __API_HOST__;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
