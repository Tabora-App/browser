# Сайт tabora.app до выпуска сертификата: отдаём статику и ACME-проверку по HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root /var/www/tabora.app;
    index index.html;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ /index.html; }
}
