# Почтовый хост: JMAP и автонастройка клиентов из Stalwart; админка Stalwart снаружи закрыта
# Единственный публичный HTTPS-хост: JMAP, автонастройка клиентов, MTA-STS. Сайт и API за туннелем.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __MAIL_HOST__ autoconfig.__DOMAIN__ autodiscover.__DOMAIN__ mta-sts.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__MAIL_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_HOST__/privkey.pem;
    include snippets/tabora-security.conf;
    client_max_body_size 100m;
    location = / { return 404; }
    location = /.well-known/mta-sts.txt { root /var/www/mta-sts; default_type text/plain; }
    location /jmap { proxy_pass http://127.0.0.1:8080; include snippets/tabora-proxy.conf; }
    location /.well-known/ { proxy_pass http://127.0.0.1:8080; include snippets/tabora-proxy.conf; }
    location /autoconfig/ { proxy_pass http://127.0.0.1:8080; include snippets/tabora-proxy.conf; }
    location /autodiscover/ { proxy_pass http://127.0.0.1:8080; include snippets/tabora-proxy.conf; }
    location /mail/ { proxy_pass http://127.0.0.1:8080; include snippets/tabora-proxy.conf; }
    location / { return 404; }
}
