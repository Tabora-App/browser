name: iOS

# Сборка Tabora для iPhone на раннере GitHub с Xcode 27: исходники Firefox для iOS (WebKit)
# закреплённого коммита плюс наши правки из src/ios. Запуск только вручную. Результат — приложение
# для симулятора iPhone и проверка, что выпускная конфигурация для телефона собирается (без подписи);
# подпись и выкладка в App Store делаются отдельно, ключи подписи в CI не хранятся (docs/IOS.md).
# Сторонние actions закреплены по полному SHA коммита (тег в комментарии).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone app (simulator)
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Download Firefox for iOS source
        run: python3 tools/ios/build.py fetch

      - name: Build tools and user scripts
        run: python3 tools/ios/build.py prepare

      - name: Apply Tabora changes
        run: python3 tools/ios/build.py import

      - name: Build
        env:
          TABORA_IOS_SIMULATOR: iPhone 17
        run: python3 tools/ios/build.py build

      - name: Pack
        run: |
          cd .build/ios/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent Client.app "$GITHUB_WORKSPACE/tabora-iphone-simulator.zip"

      # Выпускная конфигурация для телефона, без подписи: проверка, что она собирается
      # (в ней другой канал сборки и оптимизация; подпись и выкладка — отдельно, docs/IOS.md)
      - name: Build for iPhone (release configuration, unsigned)
        run: python3 tools/ios/build.py build --device

      - name: Upload build log if the build failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabora-iphone-build-log
          retention-days: 3
          if-no-files-found: ignore
          path: |
            .build/ios/build-sim.log
            .build/ios/build-device.log

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabora-iphone-simulator
          retention-days: 14
          path: tabora-iphone-simulator.zip
