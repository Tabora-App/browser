name: Android

# Сборка Tabora для Android (arm64-v8a) на Linux-раннере: движок GeckoView и приложение из того же
# дерева исходников (mobile/android/fenix). Запуск только вручную. Результат — неподписанный APK:
# ключ подписи в CI не хранится, подпись делается отдельно (tools/android/sign.sh, docs/ANDROID.md).
# Сторонние actions закреплены по полному SHA коммита (тег в комментарии).

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "Включить LTO (медленнее, но быстрее движок)"
        type: boolean
        default: false
      runner:
        description: "Раннер"
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, blacksmith-8vcpu-ubuntu-2404, blacksmith-16vcpu-ubuntu-2404]

permissions:
  contents: read

jobs:
  build:
    name: Build android-aarch64
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      TARGET_PLATFORM: android
      TARGET_ARCH: aarch64
      BROWSER_DISABLE_LTO: ${{ inputs.lto && '' || '1' }}
      BROWSER_RELEASE: 1
      # вывод gradle построчно, без перерисовки строк
      GRADLE_FLAGS: --console=plain

    steps:
      - name: Free disk space
        # файл подкачки остаётся: сборке приложения (gradle, R8) нужна память сверх 16 ГБ раннера.
        # Android SDK раннера не нужен — свой ставит mach bootstrap.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
          free -g

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential libpython3-dev m4 uuid \
            libcurl4-openssl-dev unzip gnupg --fix-missing

      - name: Download Firefox source and translations
        # хеш архива закреплён в browser.json (firefox.sha512), подпись SHA512SUMS проверяется gpg
        run: python3 tools/build.py download

      - name: Setup Rust
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          fi
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install --profile minimal "$channel"
          rustup default "$channel"
          rustup target add aarch64-linux-android

      - name: Safe Browsing key
        # ключ Google Safe Browsing из секрета (не обязателен: без него защита от фишинга не работает)
        env:
          SAFEBROWSING_API_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -n "$SAFEBROWSING_API_KEY" ]; then
            umask 077
            printf '%s' "$SAFEBROWSING_API_KEY" > "$RUNNER_TEMP/safebrowsing.key"
            echo "TABORA_SAFEBROWSING_KEYFILE=$RUNNER_TEMP/safebrowsing.key" >> "$GITHUB_ENV"
          else
            echo "::warning::нет секрета SAFEBROWSING_API_KEY: Safe Browsing в этой сборке работать не будет"
          fi

      # import заодно собирает модуль аккаунта для телефона из web/ (нужен Node.js — он есть на раннере)
      - name: Import branding and patches
        run: |
          node --version
          python3 tools/build.py import

      - name: Bootstrap Mozilla toolchains, Android SDK, NDK and JDK
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          python3 tools/build.py bootstrap
          df -h /

      # На раннере 15 ГБ памяти: компоновка движка и сборка приложения (R8, lint, демоны gradle
      # и Kotlin) временами берут больше, и тогда систему останавливает GitHub — шаг обрывается
      # без ошибки («The operation was canceled»). Файл подкачки даёт запас.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /swapfile-tabora
          sudo chmod 600 /swapfile-tabora
          sudo mkswap /swapfile-tabora > /dev/null
          sudo swapon /swapfile-tabora
          free -g

      - name: Build engine and app
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          ulimit -n 4096
          # расход памяти раз в две минуты — в журнал, чтобы обрыв было чем объяснить
          ( while true; do echo "[память] $(free -m | awk '/^Mem:/ {printf "занято %d МБ, доступно %d МБ", $3, $7} /^Swap:/ {printf ", подкачка %d МБ", $3}')"; sleep 120; done ) &
          python3 tools/build.py build

      - name: Package
        # проверяет готовый файл (имя пакета, движок, блокировщик рекламы) и кладёт его в dist/
        run: python3 tools/build.py package

      - name: Remove Safe Browsing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/safebrowsing.key"

      - name: Upload raw build output if packaging failed
        # приложение собралось, но не прошло проверку: файл нужен, чтобы разобраться без новой сборки
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabora-android-aarch64-unverified
          retention-days: 3
          if-no-files-found: ignore
          path: engine/obj-android-aarch64/gradle/build/mobile/android/fenix/app/outputs/apk/**/*arm64-v8a*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabora-android-aarch64
          retention-days: 7
          if-no-files-found: error
          path: dist/*.apk
