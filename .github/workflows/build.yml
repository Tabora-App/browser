name: Build

# Сборка на Linux-раннерах GitHub или Blacksmith. macOS собирается кросс-компиляцией
# с тулчейнами Mozilla. Запуск только вручную, чтобы не тратить минуты на каждый коммит.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Платформа"
        required: true
        type: choice
        default: darwin-aarch64
        options: [darwin-aarch64, darwin-x86_64, linux-x86_64, linux-aarch64]
      lto:
        description: "Включить LTO (медленнее, но быстрее бинарник)"
        type: boolean
        default: false
      runner:
        description: "Раннер: GitHub (бесплатно для публичного репозитория, 4 vCPU) или Blacksmith"
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, ubuntu-24.04-arm, blacksmith-4vcpu-ubuntu-2404, blacksmith-8vcpu-ubuntu-2404, blacksmith-16vcpu-ubuntu-2404]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      TARGET_PLATFORM: ${{ startsWith(inputs.platform, 'darwin') && 'darwin' || 'linux' }}
      TARGET_ARCH: ${{ endsWith(inputs.platform, 'aarch64') && 'aarch64' || 'x86_64' }}
      BROWSER_DISABLE_LTO: ${{ inputs.lto && '' || '1' }}
      BROWSER_RELEASE: 1

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid \
            libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev xvfb --fix-missing

      - name: Download Firefox source
        run: python3 tools/build.py download

      - name: Cache macOS cross toolchain
        if: env.TARGET_PLATFORM == 'darwin'
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-v1

      - name: Fetch macOS cross toolchain (cctools, dmg, hfsplus)
        if: env.TARGET_PLATFORM == 'darwin' && steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/aarch64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          source "$HOME/.cargo/env"
          case "${{ inputs.platform }}" in
            darwin-aarch64) rustup target add aarch64-apple-darwin ;;
            darwin-x86_64)  rustup target add x86_64-apple-darwin ;;
            linux-aarch64)  rustup target add aarch64-unknown-linux-gnu ;;
          esac

      - name: Import branding and patches
        run: python3 tools/build.py import

      - name: Bootstrap Mozilla toolchains
        run: |
          . "$HOME/.cargo/env"
          python3 tools/build.py bootstrap

      - name: Build
        run: |
          . "$HOME/.cargo/env"
          if [ "$TARGET_PLATFORM" = "linux" ] && [ -d "$HOME/.mozbuild/clang/bin" ]; then
            export CC="$HOME/.mozbuild/clang/bin/clang"
            export CXX="$HOME/.mozbuild/clang/bin/clang++"
          fi
          ulimit -n 4096
          python3 tools/build.py build

      - name: Package
        run: |
          . "$HOME/.cargo/env"
          python3 tools/build.py package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabora-${{ inputs.platform }}
          retention-days: 7
          path: dist/*
