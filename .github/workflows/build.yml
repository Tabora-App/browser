name: Build

# Сборка на Linux-раннерах GitHub или Blacksmith. macOS собирается кросс-компиляцией
# с тулчейнами Mozilla. Запуск только вручную, чтобы не тратить минуты на каждый коммит.
# Сторонние actions закреплены по полному SHA коммита (тег в комментарии).
# Для выпуска (workflow Release) годится только сборка на раннере GitHub (ubuntu-24.04):
# Release проверяет это по данным запуска и не подпишет артефакт со стороннего раннера.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Платформа"
        required: true
        type: choice
        default: darwin-aarch64
        options: [darwin-aarch64, darwin-x86_64, linux-x86_64, linux-aarch64]
      lto:
        description: "Включить LTO (медленнее, но быстрее бинарник)"
        type: boolean
        default: false
      runner:
        description: "Раннер: GitHub (только такие сборки идут в выпуск) или Blacksmith (для проверки, не для выпуска)"
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, ubuntu-24.04-arm, blacksmith-4vcpu-ubuntu-2404, blacksmith-8vcpu-ubuntu-2404, blacksmith-16vcpu-ubuntu-2404]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      TARGET_PLATFORM: ${{ startsWith(inputs.platform, 'darwin') && 'darwin' || 'linux' }}
      TARGET_ARCH: ${{ endsWith(inputs.platform, 'aarch64') && 'aarch64' || 'x86_64' }}
      BROWSER_DISABLE_LTO: ${{ inputs.lto && '' || '1' }}
      BROWSER_RELEASE: 1
      PLATFORM: ${{ inputs.platform }}

    steps:
      - name: Free disk space
        # вместо jlumbroso/free-disk-space: то же самое своими командами
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 && sudo rm -f /mnt/swapfile /swapfile || true
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify vendored bundles are reproducible
        # вендорные бандлы (криптография кошелька, QR сейфа) пересобираются из закреплённых
        # package-lock.json и сверяются побайтно с закоммиченными
        run: |
          set -euo pipefail
          node --version
          sh tools/wallet-vendor/verify.sh
          sh tools/vault-vendor/verify.sh

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid \
            libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev xvfb gnupg --fix-missing

      - name: Download Firefox source and translations
        # хеш архива закреплён в browser.json (firefox.sha512), подпись SHA512SUMS проверяется gpg
        run: python3 tools/build.py download

      # Тулчейн кросс-сборки macOS не кэшируется: mach проверяет загрузку по chain-of-trust
      # Taskcluster, а восстановленный кэш такой проверки не проходит.
      - name: Fetch macOS cross toolchain (cctools, dmg, hfsplus)
        if: env.TARGET_PLATFORM == 'darwin'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/aarch64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

      - name: Setup Rust
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          fi
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install --profile minimal "$channel"
          rustup default "$channel"
          case "$PLATFORM" in
            darwin-aarch64) rustup target add aarch64-apple-darwin ;;
            darwin-x86_64)  rustup target add x86_64-apple-darwin ;;
            linux-aarch64)  rustup target add aarch64-unknown-linux-gnu ;;
          esac

      - name: Safe Browsing key
        # ключ Google Safe Browsing из секрета (не обязателен: без него защита от фишинга не работает)
        env:
          SAFEBROWSING_API_KEY: ${{ secrets.SAFEBROWSING_API_KEY }}
        run: |
          if [ -n "$SAFEBROWSING_API_KEY" ]; then
            umask 077
            printf '%s' "$SAFEBROWSING_API_KEY" > "$RUNNER_TEMP/safebrowsing.key"
            echo "TABORA_SAFEBROWSING_KEYFILE=$RUNNER_TEMP/safebrowsing.key" >> "$GITHUB_ENV"
          else
            echo "::warning::нет секрета SAFEBROWSING_API_KEY: Safe Browsing в этой сборке работать не будет"
          fi

      - name: Import branding and patches
        run: python3 tools/build.py import

      - name: Bootstrap Mozilla toolchains
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          python3 tools/build.py bootstrap

      - name: Build
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          if [ "$TARGET_PLATFORM" = "linux" ] && [ -d "$HOME/.mozbuild/clang/bin" ]; then
            export CC="$HOME/.mozbuild/clang/bin/clang"
            export CXX="$HOME/.mozbuild/clang/bin/clang++"
          fi
          ulimit -n 4096
          python3 tools/build.py build

      - name: Package
        # package проверяет обновлятор (наши сертификаты, канал tabora-release, версия) и
        # кладёт в dist/ tar приложения для workflow Release
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          python3 tools/build.py package --app-tar

      - name: Remove Safe Browsing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/safebrowsing.key"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabora-${{ inputs.platform }}
          retention-days: 7
          if-no-files-found: error
          path: dist/*
