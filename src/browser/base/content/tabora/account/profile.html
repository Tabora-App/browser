<html lang="ru" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <!-- У страницы системные права: только свои скрипты, стили, шрифты и картинки из chrome://,
       никаких встроенных скриптов и стилей (стили из кода — только через CSSOM), никакой сети,
       рамок и объектов. Разметку строит profile.js через DOM, innerHTML не используется. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src chrome:; style-src chrome:; img-src chrome:; font-src chrome:; connect-src 'none'; media-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Аккаунт · Tabora</title>
  <link rel="icon" href="chrome://tabora/content/account/icon.svg" />
  <link rel="stylesheet" href="chrome://tabora/content/account/profile.css" />
</head>
<body>
  <div class="page" id="page" hidden>
    <aside class="side">
      <div class="who" id="who"></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы аккаунта" aria-orientation="vertical"></nav>
    </aside>
    <main class="content" id="content" role="tabpanel" tabindex="-1"></main>
  </div>
  <div class="gate" id="gate" hidden></div>
  <script src="chrome://tabora/content/account/profile.js"></script>
</body>
</html>
